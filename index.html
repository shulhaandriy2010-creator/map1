<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Інтерактивна карта України</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 320px;
  padding: 15px;
  border-right: 1px solid #ccc;
  overflow-y: auto;
}

#map {
  flex: 1;
}

label {
  display: block;
  margin-top: 10px;
  font-size: 14px;
}

input, textarea, select, button {
  width: 100%;
  margin-top: 4px;
  padding: 6px;
}
</style>
</head>

<body>

<div id="sidebar">
  <h3 id="regionTitle">Виберіть регіон</h3>

  <label>Колір області</label>
  <input type="color" id="fillColor">

  <label>Колір тексту</label>
  <input type="color" id="textColor">

  <label>Текст</label>
  <textarea id="note"></textarea>

  <hr>

  <label>Стрілка</label>
  <select id="arrowType">
    <option value="up">⬆ Вгору</option>
    <option value="down">⬇ Вниз</option>
  </select>

  <label>Колір стрілки</label>
  <input type="color" id="arrowColor" value="#ff0000">

  <button id="addArrow">Додати стрілку</button>

  <hr>

  <label>Дані діаграми</label>
  <input id="pieValues" placeholder="40,30,30">

  <label>Кольори секторів</label>
  <input id="pieColors" placeholder="#ff0000,#00ff00,#0000ff">

  <label>Текст у центрі</label>
  <input id="pieText" placeholder="100">

  <button id="addPie">Додати діаграму</button>

  <hr>

  <button id="exportBtn">Експортувати PNG</button>
</div>

<div id="map"></div>

<script>
const state = {};
let selectedCode = null;
let geoLayer;

const map = L.map("map").setView([49, 31], 6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

fetch("ua.json").then(r=>r.json()).then(data=>{
  data.features.forEach(f=>{
    const code = f.properties.iso_3166_2 || f.properties.id;
    state[code] = { fill:"#74add1", text:"#000", note:"" };
  });

  geoLayer = L.geoJSON(data,{
    style:f=>({ fillColor:state[f.properties.iso_3166_2]?.fill, color:"#333", weight:1, fillOpacity:0.85 }),
    onEachFeature:(f,l)=>{
      const code = f.properties.iso_3166_2 || f.properties.id;
      l.on("click",()=>selectRegion(code));
    }
  }).addTo(map);
});

function selectRegion(code){
  selectedCode = code;
  fillColor.value = state[code].fill;
  textColor.value = state[code].text;
  note.value = state[code].note;
  regionTitle.innerText = code;
}

fillColor.oninput = e=>{
  if(!selectedCode) return;
  state[selectedCode].fill = e.target.value;
  geoLayer.setStyle(f=>({ fillColor:state[f.properties.iso_3166_2].fill }));
};

textColor.oninput = e=>{
  if(!selectedCode) return;
  state[selectedCode].text = e.target.value;
};

note.oninput = e=>{
  if(!selectedCode) return;
  state[selectedCode].note = e.target.value;
};

addArrow.onclick = ()=>{
  if(!selectedCode) return;
  geoLayer.eachLayer(l=>{
    const c = l.feature.properties.iso_3166_2;
    if(c===selectedCode){
      L.marker(l.getBounds().getCenter(),{
        icon:L.divIcon({
          html:`<div style="font-size:26px;color:${arrowColor.value}">${arrowType.value==="up"?"⬆":"⬇"}</div>`
        })
      }).addTo(map);
    }
  });
};

function pieSVG(values,colors,text){
  let total = values.reduce((a,b)=>a+b,0);
  let a=0, p="";
  values.forEach((v,i)=>{
    let a2 = a + v/total*2*Math.PI;
    let x1=50+50*Math.cos(a), y1=50+50*Math.sin(a);
    let x2=50+50*Math.cos(a2), y2=50+50*Math.sin(a2);
    let l = a2-a>Math.PI?1:0;
    p+=`<path d="M50 50 L${x1} ${y1} A50 50 0 ${l} 1 ${x2} ${y2} Z" fill="${colors[i]}"/>`;
    a=a2;
  });
  return `<svg width="100" height="100">${p}<text x="50" y="55" text-anchor="middle" font-size="12">${text}</text></svg>`;
}

addPie.onclick = ()=>{
  if(!selectedCode) return;
  const v = pieValues.value.split(",").map(Number);
  const c = pieColors.value.split(",");
  geoLayer.eachLayer(l=>{
    if(l.feature.properties.iso_3166_2===selectedCode){
      L.marker(l.getBounds().getCenter(),{
        icon:L.divIcon({
          html:pieSVG(v,c,pieText.value),
          iconSize:[100,100]
        })
      }).addTo(map);
    }
  });
};

exportBtn.onclick = ()=>{
  html2canvas(map.getContainer()).then(c=>{
    const a=document.createElement("a");
    a.download="map.png";
    a.href=c.toDataURL();
    a.click();
  });
};
</script>

</body>
</html>
