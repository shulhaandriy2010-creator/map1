<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Інтерактивна карта України</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    background: #f4f4f7;
  }

  #sidebar {
    width: 340px;
    padding: 20px;
    border-right: 1px solid #ddd;
    box-sizing: border-box;
    overflow-y: auto;
    background: #ffffff;
    box-shadow: 2px 0 5px rgba(0,0,0,0.05);
  }

  #map-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  label {
    display: block;
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
  }

  /* Розмір тексту збільшено вдвічі */
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 28px; 
    border: 1px solid #ccc;
    border-radius: 4px;
    margin-top: 5px;
  }

  input[type="color"] {
    height: 60px;
    padding: 2px;
    cursor: pointer;
  }

  /* Стилі для SVG карти */
  svg {
    width: 100%;
    height: 100%;
    max-width: 900px;
    max-height: 600px;
  }

  path {
    transition: fill 0.2s, stroke 0.2s;
    cursor: pointer;
  }

  path:hover {
    stroke: #000000 !important;
    stroke-width: 3px !important;
  }

  /* Стилі для підписів областей */
  .region-label {
    font-family: Arial, sans-serif;
    font-size: 11px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h3 id="regionTitle" style="font-size: 24px; margin-top: 0; color: #111;">Виберіть регіон</h3>

  <label>Колір заливки області</label>
  <input type="color" id="fillColor" value="#74add1">

  <label>Колір тексту назви</label>
  <input type="color" id="textColor" value="#000000">

  <label>Додатковий текст 1</label>
  <textarea id="note" rows="2"></textarea>

  <label>Колір тексту замітки 2</label>
  <input type="color" id="textColor2" value="#ff0000">

<script>
const UA_NAMES = {
  "UA05": "Вінницька", "UA07": "Волинська", "UA09": "Луганська",
  "UA12": "Дніпропетровська", "UA14": "Донецька", "UA18": "Житомирська",
  "UA21": "Закарпатська", "UA23": "Запорізька", "UA26": "Івано-Франківська",
  "UA30": "Київська", "UA32": "м. Київ", "UA35": "Кіровоградська",
  "UA40": "м. Севастополь", "UA43": "АР Крим", "UA46": "Львівська",
  "UA48": "Миколаївська", "UA51": "Одеська", "UA53": "Полтавська",
  "UA56": "Рівненська", "UA59": "Сумська", "UA61": "Тернопільська",
  "UA63": "Харківська", "UA65": "Херсонська", "UA68": "Хмельницька",
  "UA71": "Черкаська", "UA74": "Чернігівська", "UA77": "Чернівецька"
};

// Стан для кожної області
const state = {};
let selectedCode = null;

// Ініціалізація стану та створення текстових блоків
const paths = document.querySelectorAll('path');
const labelsContainer = document.getElementById('labelsContainer');

paths.forEach(path => {
  const code = path.id;
  state[code] = {
    name: UA_NAMES[code] || code,
    fill: code === "UA32" ? "#b3de69" : (code === "UA40" ? "#bebada" : "#74add1"),
    text: "#000000",
    text2: "#ff0000",
    note: "",
    note2: ""
  };

  // Отримуємо координати центру з атрибутів data
  const cx = path.getAttribute('data-cx');
  const cy = path.getAttribute('data-cy');

  // Створюємо SVG групу для тексту поверх кожної області
  const g = document.createElementNS("http://w3.org", "g");
  g.setAttribute("id", "label-" + code);
  g.setAttribute("transform", `translate(${cx}, ${cy}) scale(0.02)`); // Масштабуємо під координати карти

  labelsContainer.appendChild(g);
  
  // Прив'язуємо клік на область
  path.addEventListener('click', () => selectRegion(code));
});

function renderLabels() {
  paths.forEach(path => {
    const code = path.id;
    const r = state[code];
    const g = document.getElementById("label-" + code);
    
    // Очищуємо старий текст
    g.innerHTML = "";

    // Назва області
    const t1 = document.createElementNS("http://w3.org", "text");
    t1.setAttribute("text-anchor", "middle");
    t1.setAttribute("fill", r.text);
    t1.setAttribute("style", "font-weight: bold; font-family: Arial; font-size: 14px;");
    t1.textContent = r.name;
    g.appendChild(t1);

    let currentY = 15;

    // Додатковий текст 1
    if (r.note) {
      const lines = r.note.split('\n');
      lines.forEach(line => {
        const t2 = document.createElementNS("http://w3.org", "text");
        t2.setAttribute("text-anchor", "middle");
        t2.setAttribute("y", currentY);
        t2.setAttribute("fill", r.text);
        t2.setAttribute("style", "font-family: Arial; font-size: 11px; font-weight: normal;");
        t2.textContent = line;
        g.appendChild(t2);
        currentY += 13;
      });
    }

    // Додатковий текст 2
    if (r.note2) {
      const lines2 = r.note2.split('\n');
      lines2.forEach(line => {
