<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Інтерактивна карта України</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com" />
<script src="https://unpkg.com"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
  }

  #sidebar {
    width: 320px;
    padding: 15px;
    border-right: 1px solid #ddd;
    box-sizing: border-box;
    overflow-y: auto;
    background: #ffffff;
  }

  #map {
    flex: 1;
    background: #f0f0f0;
  }

  label {
    display: block;
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
  }

  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 28px; 
  }

  input[type="color"] {
    height: 50px;
    padding: 2px;
  }

  .region-tooltip {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    pointer-events: none !important;
  }
</style>
</head>

<body>

<div id="sidebar">
  <h3 id="regionTitle" style="font-size: 24px; margin-top: 0;">Виберіть регіон</h3>

  <label>Колір заливки області</label>
  <input type="color" id="fillColor">

  <label>Колір тексту назви</label>
  <input type="color" id="textColor">

  <label>Додатковий текст 1</label>
  <textarea id="note" rows="2"></textarea>

  <label>Колір тексту замітки 2</label>
  <input type="color" id="textColor2">

  <label>Додатковий текст 2</label>
  <textarea id="note2" rows="2"></textarea>
</div>

<div id="map"></div>

  "UA48": "Миколаївська", "UA51": "Одеська", "UA53": "Полтавська",
  "UA56": "Рівненська", "UA59": "Сумська", "UA61": "Тернопільська",
  "UA63": "Харківська", "UA65": "Херсонська", "UA68": "Хмельницька",

const map = L.map("map").setView([49.0, 31.0], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

function createTooltipHtml(r) {
  const noteHtml1 = r.note ? `<div style="margin-top:4px; font-weight:normal; color:${r.text};">${r.note.replace(/\n/g, '<br>')}</div>` : '';
  const noteHtml2 = r.note2 ? `<div style="margin-top:4px; font-weight:normal; color:${r.text2};">${r.note2.replace(/\n/g, '<br>')}</div>` : '';
  
  return `<div style="font-size:12px; text-align:center; font-family:Arial,sans-serif; line-height:1.2;">
    <b style="color:${r.text};">${r.name}</b>
    ${noteHtml1}
    ${noteHtml2}
  </div>`;
}

  ]
};

geoData.features.forEach(f => {
  const code = f.properties.id;
  state[code] = {
    name: UA_NAMES[code] || code,
    fill: "#74add1",
    text: "#000000",
    text2: "#ff0000",
    note: "",
    note2: ""
  };
});

geoLayer = L.geoJSON(geoData, {
  style: feature => {
    const c = feature.properties.id;
    return {
      fillColor: state[c]?.fill || "#ccc",
      weight: 1.5,
      color: "#333",
      fillOpacity: 0.7
    };
  },
  onEachFeature: (feature, layer) => {
    const code = feature.properties.id;

    layer.on({
      mouseover: (e) => {
        e.target.setStyle({ weight: 3, color: "#000" });
      },
      mouseout: (e) => { geoLayer.resetStyle(e.target); },
      click: () => selectRegion(code)
    });

    layer.bindTooltip(() => createTooltipHtml(state[code]), {
      permanent: true,
      direction: "center",
      className: "region-tooltip"
    }).openTooltip();
  }
}).addTo(map);

function selectRegion(code) {
  selectedCode = code;
  const r = state[code];

  document.getElementById("regionTitle").innerText = r.name;
  document.getElementById("fillColor").value = r.fill;
  document.getElementById("textColor").value = r.text;
  document.getElementById("note").value = r.note;
  
  document.getElementById("textColor2").value = r.text2;
  document.getElementById("note2").value = r.note2;
}

document.getElementById("fillColor").oninput = e => {
  if (!selectedCode) return;
  state[selectedCode].fill = e.target.value;
  geoLayer.setStyle(f => {
    return { fillColor: state[f.properties.id].fill };
  });
};

document.getElementById("textColor").oninput = e => {
  if (!selectedCode) return;
  state[selectedCode].text = e.target.value;
  updateActiveTooltip();
};

document.getElementById("note").oninput = e => {
  if (!selectedCode) return;
  state[selectedCode].note = e.target.value;
  updateActiveTooltip();
};

  if (!selectedCode) return;
  state[selectedCode].text2 = e.target.value;
