<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Інтерактивна карта України</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 340px;
  padding: 15px;
  border-right: 1px solid #ddd;
}

#map {
  flex: 1;
}

label {
  display:block;
  margin-top:10px;
}

input, textarea {
  width:100%;
  padding:5px;
}
</style>
</head>

<body>

<div id="sidebar">
  <h3 id="regionTitle">Оберіть регіон</h3>

  <label>Колір заливки</label>
  <input type="color" id="fillColor">

  <label>Колір тексту</label>
  <input type="color" id="textColor">

  <label>Текст 1</label>
  <textarea id="note"></textarea>

  <label>Текст 2</label>
  <textarea id="note2"></textarea>
</div>

<div id="map"></div>

<script>
const UA_NAMES = {
 "UA05":"Вінницька","UA07":"Волинська","UA09":"Луганська",
 "UA12":"Дніпропетровська","UA14":"Донецька","UA18":"Житомирська",
 "UA21":"Закарпатська","UA23":"Запорізька","UA26":"Івано-Франківська",
 "UA30":"Київська","UA32":"м. Київ","UA35":"Кіровоградська",
 "UA40":"м. Севастополь","UA43":"АР Крим","UA46":"Львівська",
 "UA48":"Миколаївська","UA51":"Одеська","UA53":"Полтавська",
 "UA56":"Рівненська","UA59":"Сумська","UA61":"Тернопільська",
 "UA63":"Харківська","UA65":"Херсонська","UA68":"Хмельницька",
 "UA71":"Черкаська","UA74":"Чернігівська","UA77":"Чернівецька"
};

let state = {};
let selected = null;
let geoLayer = null;

const map = L.map("map").setView([49,31],6);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {attribution:""}
).addTo(map);

fetch("ua.json")
.then(r=>r.json())
.then(data=>{    data.features.forEach(f=>{
      const code =
        f.properties.iso_3166_2 ||
        f.properties.ISO_3166_2 ||
        f.properties.id;

      state[code] = {
        name: UA_NAMES[code] || code,
        fill: "#74add1",
        text: "#000000",
        note: "",
        note2: ""
      };
    });

    geoLayer = L.geoJSON(data, {
      style: f=>{
        const c =
          f.properties.iso_3166_2 ||
          f.properties.ISO_3166_2 ||
          f.properties.id;

        return {
          fillColor: state[c]?.fill || "#ccc",
          color: "#333",
          weight: 1,
          fillOpacity: 0.85
        };
      },

      onEachFeature: (feature, layer)=>{

        const code =
          feature.properties.iso_3166_2 ||
          feature.properties.ISO_3166_2 ||
          feature.properties.id;

        // CLICK
        layer.on("click", ()=>selectRegion(code));

        // HOVER (товстіший контур)
        layer.on("mouseover", function(){
          this.setStyle({
            weight: 4,
            color: "#000"
          });
        });

        layer.on("mouseout", function(){
          geoLayer.resetStyle(this);
        });        const center = layer.getBounds().getCenter();

        layer.label = L.marker(center, {
          icon: L.divIcon({
            className: "",
            html: `
              <div style="
                text-align:center;
                color:${state[code].text};
                line-height:1.2;
              ">

                <div style="
                  font-size:14px;
                  font-weight:bold;
                ">
                  ${state[code].name}
                </div>

                <div style="
                  font-size:38px;
                  font-weight:bold;
                ">
                  ${state[code].note}
                </div>

                <div style="
                  font-size:38px;
                  font-weight:bold;
                ">
                  ${state[code].note2}
                </div>

              </div>
            `
          })
        }).addTo(map);

      }
    }).addTo(map);
});function selectRegion(code){
  selected = code;
  const r = state[code];

  document.getElementById("regionTitle").innerText = r.name;
  document.getElementById("fillColor").value = r.fill;
  document.getElementById("textColor").value = r.text;
  document.getElementById("note").value = r.note;
  document.getElementById("note2").value = r.note2;
}document.getElementById("fillColor").oninput = e=>{
  if(!selected) return;
  state[selected].fill = e.target.value;
  geoLayer.setStyle(f=>{
    const c =
      f.properties.iso_3166_2 ||
      f.properties.ISO_3166_2 ||
      f.properties.id;

    return {fillColor: state[c].fill};
  });
};

document.getElementById("textColor").oninput = e=>{
  if(!selected) return;
  state[selected].text = e.target.value;
  redraw();
};

document.getElementById("note").oninput = e=>{
  if(!selected) return;
  state[selected].note = e.target.value;
  redraw();
};

document.getElementById("note2").oninput = e=>{
  if(!selected) return;
  state[selected].note2 = e.target.value;
  redraw();
};function redraw(){

  geoLayer.eachLayer(layer=>{
    if(layer.label){
      map.removeLayer(layer.label);
    }

    const c =
      layer.feature.properties.iso_3166_2 ||
      layer.feature.properties.ISO_3166_2 ||
      layer.feature.properties.id;

    const center = layer.getBounds().getCenter();

    layer.label = L.marker(center, {
      icon: L.divIcon({
        className: "",
        html: `
          <div style="
            text-align:center;
            color:${state[c].text};
            line-height:1.2;
          ">

            <div style="font-size:14px;font-weight:bold;">
              ${state[c].name}
            </div>

            <div style="font-size:38px;font-weight:bold;">
              ${state[c].note}
            </div>

            <div style="font-size:38px;font-weight:bold;">
              ${state[c].note2}
            </div>

          </div>
        `
      })
    }).addTo(map);

  });
}
