<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Інтерактивна карта України</title>

<link rel="stylesheet" href="https://unpkg.com"/>
<script src="https://unpkg.com"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 340px;
  padding: 15px;
  border-right: 1px solid #ddd;
  box-sizing: border-box;
  background: #f9f9f9;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.controls {
  overflow-y: auto;
  flex: 1;
  padding-bottom: 15px;
}

.buttons-panel {
  border-top: 1px solid #ddd;
  padding-top: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#map {
  flex: 1;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  box-sizing: border-box;
}

textarea {
  height: 60px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 10px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background-color: #0056b3;
}

.btn-presentation {
  background-color: #28a745;
}

.btn-presentation:hover {
  background-color: #218838;
}

/* Кнопка повернення з презентації, яка з'являється на карті */
#exitPresBtn {
  position: absolute;
  top: 10px;
  left: 60px;
  z-index: 1000;
  display: none;
  width: auto;
  background-color: #dc3545;
}
#exitPresBtn:hover {
  background-color: #c82333;
}
</style>
</head>

<body>

<div id="sidebar">
  <div class="controls">
    <h3 id="regionTitle">Оберіть регіон на карті</h3>

    <label>Колір заливки регіону</label>
    <input type="color" id="fillColor" disabled>

    <label>Колір тексту підписів</label>
    <input type="color" id="textColor" disabled>

    <label>Текст 1 (Великий)</label>
    <textarea id="note" disabled></textarea>

    <label>Текст 2 (Великий)</label>
    <textarea id="note2" disabled></textarea>
  </div>

  <div class="buttons-panel">
    <button onclick="exportData()">Експорт JSON</button>
    <button onclick="togglePresentation()" class="btn-presentation">Режим презентації</button>
  </div>
</div>

<div id="map">
  <button id="exitPresBtn" onclick="togglePresentation()">Вийти з презентації</button>
</div>

<script>
const UA_NAMES = {
 "UA05":"Вінницька","UA07":"Волинська","UA09":"Луганська",
 "UA12":"Дніпропетровська","UA14":"Донецька","UA18":"Житомирська",
 "UA21":"Закарпатська","UA23":"Запорізька","UA26":"Івано-Франківська",
 "UA30":"Київська","UA32":"м. Київ","UA35":"Кіровоградська",
 "UA40":"м. Севастополь","UA43":"АР Крим","UA46":"Львівська",
 "UA48":"Миколаївська","UA51":"Одеська","UA53":"Полтавська",
 "UA56":"Рівненська","UA59":"Сумська","UA61":"Тернопільська",
 "UA63":"Харківська","UA65":"Херсонська","UA68":"Хмельницька",
 "UA71":"Черкаська","UA74":"Чернігівська","UA77":"Чернівецька"
};

let state = {};
let selected = null;
let geoLayer = null;
let presentation = false;

// Ініціалізація карти
const map = L.map("map").setView([48.5, 31.2], 6);

L.tileLayer(
  "https://{s}://{z}/{x}/{y}{r}.png",
  { attribution: "© OpenStreetMap contributors © CARTO" }
).addTo(map);

// Завантаження та ініціалізація
fetch("ua.json")
.then(r => r.json())
.then(data => {
    // 1. Спочатку створюємо базовий стан
    data.features.forEach(f => {
      const code = f.properties.iso_3166_2 || f.properties.ISO_3166_2 || f.properties.id;
      if (!code) return;

      state[code] = {
        name: UA_NAMES[code] || code,
        fill: "#74add1",
        text: "#000000",
        note: "",
        note2: ""
      };
    });

    // 2. Завантажуємо збережений стан з localStorage, якщо він є
    loadState();

    // 3. Малюємо шари на карті, використовуючи актуальний стан
    geoLayer = L.geoJSON(data, {
      style: feature => {
        const code = feature.properties.iso_3166_2 || feature.properties.ISO_3166_2 || feature.properties.id;
        return {
          fillColor: state[code]?.fill || "#ccc",
          color: "#333",
          weight: 1,
          fillOpacity: 0.85
        };
      },

      onEachFeature: (feature, layer) => {
        const code = feature.properties.iso_3166_2 || feature.properties.ISO_3166_2 || feature.properties.id;
        if (!code) return;

        layer.on("click", () => selectRegion(code));

        layer.on("mouseover", function() {
          this.setStyle({ weight: 3, color: "#000" });
          this.bringToFront();
          if (this.label) this.label.bringToFront();
        });

        layer.on("mouseout", function() {
          this.setStyle({
            weight: 1,
            color: "#333",
            fillColor: state[code]?.fill || "#ccc"
          });
        });

        const center = layer.getBounds().getCenter();
        createLabel(layer, code, center);
      }
    }).addTo(map);
})
.catch(err => console.error("Помилка завантаження ua.json:", err));

// Створення/оновлення підписів
function createLabel(layer, code, center) {
  layer.label = L.marker(center, {
    icon: L.divIcon({
      className: "custom-region-label",
      html: `
        <div style="text-align:center; color:${state[code].text}; line-height:1.2; pointer-events:none; min-width:150px; transform:translate(-50%, -50%);">
          <div style="font-size:12px; font-weight:bold; text-shadow: 1px 1px 2px white;">${state[code].name}</div>
          <div style="font-size:28px; font-weight:bold; text-shadow: 1px 1px 2px white;">${state[code].note}</div>
          <div style="font-size:28px; font-weight:bold; text-shadow: 1px 1px 2px white;">${state[code].note2}</div>
        </div>
      `
    })
  }).addTo(map);
}

// Функції збереження та завантаження локального стану
function saveState(){
  localStorage.setItem("ua_map_state", JSON.stringify(state));
}

function loadState(){
  const saved = localStorage.getItem("ua_map_state");
  if(!saved) return;

  const parsed = JSON.parse(saved);
  for(const k in parsed){
    if(state[k]){
      state[k] = parsed[k];
    }
  }
}

// Вибір регіону
function selectRegion(code) {
  selected = code;
  const r = state[code];

  document.getElementById("regionTitle").innerText = r.name;
  
  const inputs = ["fillColor", "textColor", "note", "note2"];
  inputs.forEach(id => {
    const el = document.getElementById(id);
    el.value = r[id === "fillColor" ? "fill" : id === "textColor" ? "text" : id];
    el.disabled = false;
  });
}

// Оновлення конкретного маркера на карті
function updateLabels() {
  if (!selected) return;
  
  geoLayer.eachLayer(layer => {
    const c = layer.feature.properties.iso_3166_2 || layer.feature.properties.ISO_3166_2 || layer.feature.properties.id;
    if (c === selected) {
      if (layer.label) {
        map.removeLayer(layer.label);
      }
      const center = layer.getBounds().getCenter();
      createLabel(layer, selected, center);
    }
  });
}

// Обробники подій для полів введення (Оновлення + Збереження)
document.getElementById("fillColor").oninput = e => {
  if (!selected) return;
  state[selected].fill = e.target.value;
  
  geoLayer.eachLayer(layer => {
    const c = layer.feature.properties.iso_3166_2 || layer.feature.properties.ISO_3166_2 || layer.feature.properties.id;
    if (c === selected) {
      layer.setStyle({ fillColor: state[selected].fill });
    }
  });
  saveState();
};

document.getElementById("textColor").oninput = e => {
  if (!selected) return;
  state[selected].text = e.target.value;
  updateLabels();
  saveState();
};

document.getElementById("note").oninput = e => {
  if (!selected) return;
  state[selected].note = e.target.value;
  updateLabels();
  saveState();
};

document.getElementById("note2").oninput = e => {
  if (!selected) return;
  state[selected].note2 = e.target.value;
  updateLabels();
  saveState();
};

// Експорт даних у файл JSON
function exportData(){
  const blob = new Blob(
    [JSON.stringify(state, null, 2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ua-map-data.json";
  a.click();
  URL.revokeObjectURL(url);
}

// Режим презентації
function togglePresentation(){
  presentation = !presentation;

  const sidebar = document.getElementById("sidebar");
  const exitBtn = document.getElementById("exitPresBtn");

  if(presentation) {
    sidebar.style.display = "none";
    exitBtn.style.display = "block";
  } else {
    sidebar.style.display = "flex";
    exitBtn.style.display = "none";
  }

  setTimeout(() => map.invalidateSize(), 300);
}
</script>

</body>
</html>
