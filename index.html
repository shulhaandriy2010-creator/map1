<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Інтерактивна карта України</title>

<!-- Leaflet (працює ВСЮДИ) -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
  }

  #sidebar {
    width: 300px;
    padding: 15px;
    border-right: 1px solid #ddd;
    box-sizing: border-box;
  }

  #map {
    flex: 1;
  }

  label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
  }

  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 5px;
  }
</style>
</head>

<body>

<div id="sidebar">
  <h3 id="regionTitle">Виберіть регіон</h3>

  <label>Колір заливки</label>
  <input type="color" id="fillColor">

  <label>Колір тексту</label>
  <input type="color" id="textColor">

  <label>Додатковий текст</label>
  <textarea id="note" rows="3"></textarea>
</div>

<div id="map"></div>

<script>
const UA_NAMES = {
  "UA05": "Вінницька",
  "UA07": "Волинська",
  "UA09": "Луганська",
  "UA12": "Дніпропетровська",
  "UA14": "Донецька",
  "UA18": "Житомирська",
  "UA21": "Закарпатська",
  "UA23": "Запорізька",
  "UA26": "Івано-Франківська",
  "UA30": "Київська",
  "UA32": "м. Київ",
  "UA35": "Кіровоградська",
  "UA40": "м. Севастополь",
  "UA43": "АР Крим",
  "UA46": "Львівська",
  "UA48": "Миколаївська",
  "UA51": "Одеська",
  "UA53": "Полтавська",
  "UA56": "Рівненська",
  "UA59": "Сумська",
  "UA61": "Тернопільська",
  "UA63": "Харківська",
  "UA65": "Херсонська",
  "UA68": "Хмельницька",
  "UA71": "Черкаська",
  "UA74": "Чернігівська",
  "UA77": "Чернівецька"
};

const state = {};
let selectedCode = null;
let geoLayer = null;

const map = L.map("map").setView([49, 31], 6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: ""
}).addTo(map);

fetch("ua.json")
  .then(r => r.json())
  .then(data => {
    data.features.forEach(f => {
      const code = f.properties.iso_3166_2 || f.properties.ISO_3166_2 || f.properties.id;
      state[code] = {
        name: UA_NAMES[code] || code,
        fill: "#74add1",
        text: "#000000",
        note: ""
      };
    });

    geoLayer = L.geoJSON(data, {
      style: feature => {
        const c = feature.properties.iso_3166_2 || feature.properties.ISO_3166_2 || feature.properties.id;
        return {
          fillColor: state[c]?.fill || "#ccc",
          weight: 1,
          color: "#333",
          fillOpacity: 0.85
        };
      },
      onEachFeature: (feature, layer) => {
        const code = feature.properties.iso_3166_2 || feature.properties.ISO_3166_2 || feature.properties.id;

        layer.on("click", () => selectRegion(code));

        const center = layer.getBounds().getCenter();
        layer.label = L.marker(center, {
          icon: L.divIcon({
            className: "",
            html: `<div style="font-size:10px;text-align:center;color:${state[code].text}">
              <b>${state[code].name}</b><br>${state[code].note}
            </div>`
          })
        }).addTo(map);
      }
    }).addTo(map);
  });

function selectRegion(code) {
  selectedCode = code;
  const r = state[code];

  document.getElementById("regionTitle").innerText = r.name;
  document.getElementById("fillColor").value = r.fill;
  document.getElementById("textColor").value = r.text;
  document.getElementById("note").value = r.note;
}

document.getElementById("fillColor").oninput = e => {
  if (!selectedCode) return;
  state[selectedCode].fill = e.target.value;
  geoLayer.setStyle(f => {
    const c = f.properties.iso_3166_2 || f.properties.ISO_3166_2 || f.properties.id;
    return { fillColor: state[c].fill };
  });
};

document.getElementById("textColor").oninput = e => {
  if (!selectedCode) return;
  state[selectedCode].text = e.target.value;
  map.eachLayer(l => {
    if (l.label) map.removeLayer(l.label);
  });
  geoLayer.eachLayer(layer => {
    const c = layer.feature.properties.iso_3166_2 || layer.feature.properties.ISO_3166_2 || layer.feature.properties.id;
    const center = layer.getBounds().getCenter();
    layer.label = L.marker(center, {
      icon: L.divIcon({
        className: "",
        html: `<div style="font-size:10px;text-align:center;color:${state[c].text}">
          <b>${state[c].name}</b><br>${state[c].note}
        </div>`
      })
    }).addTo(map);
  });
};

document.getElementById("note").oninput = e => {
  if (!selectedCode) return;
  state[selectedCode].note = e.target.value;
  document.getElementById("textColor").dispatchEvent(new Event("input"));
};
</script>

</body>
</html>
