<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Інтерактивна карта України</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body { margin:0; font-family: Arial; display:flex; height:100vh; }
#sidebar { width:320px; padding:15px; border-right:1px solid #ccc; overflow-y:auto; }
#map { flex:1; }
label { display:block; margin-top:10px; font-size:14px; }
input, textarea, select, button { width:100%; margin-top:4px; padding:6px; }
hr { margin:10px 0; }
</style>
</head>
<body>

<div id="sidebar">
<h3 id="regionTitle">Виберіть регіон</h3>

<label>Колір області</label>
<input type="color" id="fillColor">

<label>Колір тексту</label>
<input type="color" id="textColor">

<label>Додатковий текст</label>
<textarea id="note"></textarea>

<hr>

<label>Стрілка</label>
<select id="arrowType">
<option value="up">⬆ Вгору</option>
<option value="down">⬇ Вниз</option>
</select>

<label>Колір стрілки</label>
<input type="color" id="arrowColor" value="#ff0000">

<button id="addArrow">Додати стрілку</button>

<hr>

<label>Дані діаграми (через коми)</label>
<input id="pieValues" placeholder="40,30,30">

<label>Кольори секторів (через коми)</label>
<input id="pieColors" placeholder="#ff0000,#00ff00,#0000ff">

<label>Текст у центрі</label>
<input id="pieText" placeholder="100">

<button id="addPie">Додати діаграму</button>

<hr>

<button id="exportBtn">Експортувати PNG</button>
</div>

<div id="map"></div>

<script>
// --- Налаштування ---
const UA_NAMES = {
"UA05":"Вінницька","UA07":"Волинська","UA09":"Луганська","UA12":"Дніпропетровська",
"UA14":"Донецька","UA18":"Житомирська","UA21":"Закарпатська","UA23":"Запорізька",
"UA26":"Івано-Франківська","UA30":"Київська","UA32":"м. Київ","UA35":"Кіровоградська",
"UA40":"м. Севастополь","UA43":"АР Крим","UA46":"Львівська","UA48":"Миколаївська",
"UA51":"Одеська","UA53":"Полтавська","UA56":"Рівненська","UA59":"Сумська",
"UA61":"Тернопільська","UA63":"Харківська","UA65":"Херсонська","UA68":"Хмельницька",
"UA71":"Черкаська","UA74":"Чернігівська","UA77":"Чернівецька"
};

const state = {};
let selectedCode = null;
let geoLayer = null;

const map = L.map("map").setView([49,31],6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);

// --- Завантаження локального GeoJSON ---
fetch("ua.json")
.then(r=>r.json())
.then(data=>{
  // Ініціалізація стану
  data.features.forEach(f=>{
    const code = f.properties.iso_3166_2 || f.properties.ISO_3166_2 || f.properties.id;
    state[code]={name:UA_NAMES[code]||code, fill:"#74add1", text:"#000000", note:""};
  });

  geoLayer = L.geoJSON(data, {
    style: f=>{
      const code = f.properties.iso_3166_2 || f.properties.ISO_3166_2 || f.properties.id;
      return { fillColor: state[code].fill, color:"#333", weight:1, fillOpacity:0.85 };
    },
    onEachFeature: (f,l)=>{
      const code = f.properties.iso_3166_2 || f.properties.ISO_3166_2 || f.properties.id;
      l.on("click", ()=>selectRegion(code));
      addLabel(l, code);
    }
  }).addTo(map);
});

function selectRegion(code){
  selectedCode=code;
  const r=state[code];
  document.getElementById("regionTitle").innerText = r.name;
  document.getElementById("fillColor").value = r.fill;
  document.getElementById("textColor").value = r.text;
  document.getElementById("note").value = r.note;
}

// --- Зміна кольору заливки ---
document.getElementById("fillColor").addEventListener("input", ()=>{
  if(!selectedCode) return;
  state[selectedCode].fill=document.getElementById("fillColor").value;
  geoLayer.setStyle(f=>{
    const c=f.properties.iso_3166_2||f.properties.ISO_3166_2||f.properties.id;
    return { fillColor: state[c].fill };
  });
});

// --- Зміна тексту ---
document.getElementById("textColor").addEventListener("input", updateLabels);
document.getElementById("note").addEventListener("input", updateLabels);

function addLabel(layer, code){
  const center=layer.getBounds().getCenter();
  layer.label=L.marker(center,{
    icon:L.divIcon({
      className:"",
      html:`<div style="font-size:10px;text-align:center;color:${state[code].text}">
      <b>${UA_NAMES[code]||layer.feature.properties.name}</b><br>${state[code].note}</div>`
    })
  }).addTo(map);
}

function updateLabels(){
  if(!selectedCode) return;
  state[selectedCode].text=document.getElementById("textColor").value;
  state[selectedCode].note=document.getElementById("note").value;
  geoLayer.eachLayer(layer=>{
    const code=layer.feature.properties.iso_3166_2||layer.feature.properties.ISO_3166_2||layer.feature.properties.id;
    if(code===selectedCode){
      if(layer.label) map.removeLayer(layer.label);
      addLabel(layer, code);
    }
  });
}

// --- Додавання стрілки ---
document.getElementById("addArrow").onclick=()=>{
  if(!selectedCode) return;
  const arrow=document.getElementById("arrowType").value==="up"?"⬆":"⬇";
  const color=document.getElementById("arrowColor").value;
  geoLayer.eachLayer(layer=>{
    const code=layer.feature.properties.iso_3166_2||layer.feature.properties.ISO_3166_2||layer.feature.properties.id;
    if(code===selectedCode){
      const center=layer.getBounds().getCenter();
      // Зсув трохи вгору, щоб не перекривати текст
      const newLat=center.lat + 0.2;
      L.marker([newLat, center.lng],{
        icon:L.divIcon({
          html:`<div style="font-size:26px;color:${color};text-align:center">${arrow}</div>`
        })
      }).addTo(map);
    }
  });
};

// --- Додавання pie chart ---
document.getElementById("addPie").onclick=()=>{
  if(!selectedCode) return;
  const values=document.getElementById("pieValues").value.split(",").map(Number);
  const colors=document.getElementById("pieColors").value.split(",");
  const text=document.getElementById("pieText").value;
  geoLayer.eachLayer(layer=>{
    const code=layer.feature.properties.iso_3166_2||layer.feature.properties.ISO_3166_2||layer.feature.properties.id;
    if(code===selectedCode){
      const center=layer.getBounds().getCenter();
      // Зсув трохи вниз, щоб не перекривати текст
      const newLat=center.lat - 0.2;
      L.marker([newLat, center.lng],{
        icon:L.divIcon({
          html:pieSVG(values,colors,text),
          iconSize:[100,100]
        })
      }).addTo(map);
    }
  });
};


document.getElementById("addPie").onclick=()=>{
  if(!selectedCode) return;
  const values=document.getElementById("pieValues").value.split(",").map(Number);
  const colors=document.getElementById("pieColors").value.split(",");
  const text=document.getElementById("pieText").value;
  geoLayer.eachLayer(layer=>{
    const code=layer.feature.properties.iso_3166_2||layer.feature.properties.ISO_3166_2||layer.feature.properties.id;
    if(code===selectedCode){
      const center=layer.getBounds().getCenter();
      L.marker(center,{
        icon:L.divIcon({
          html:pieSVG(values,colors,text),
          iconSize:[100,100]
        })
      }).addTo(map);
    }
  });
};

// --- Експорт у PNG ---
document.getElementById("exportBtn").onclick=()=>{
  html2canvas(map.getContainer()).then(canvas=>{
    const a=document.createElement("a");
    a.href=canvas.toDataURL();
    a.download="ukraine-map.png";
    a.click();
  });
};
</script>
</body>
</html>
